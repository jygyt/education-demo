<div class="container">
  <div class="header">
    <div class="header-info  content">
      <div class="logo">
     </div>
      <div class="link">
    </div>
    </div>


  </div>

  <div class="carousel">
    <app-carousel [images]="listOfData"></app-carousel>

  </div>

  <button nzShape="circle" class="fixed-button" nz-button nzType="primary" nzSize="large"
    (click)="openReport()">点击报名</button>

    <h2>
      院校介绍

    <h4>
      为家长、学生提供详细的学校介绍服务
    </h4>
  </div>

  <div class="school content">
    <div class="item" *ngFor="let data of listOfDataSchool">
      <nz-card class="card" style="width:300px;margin-bottom: 20px" [nzCover]="coverTemplate" [nzActions]="[actionSetting]">
        <nz-card-meta
          [nzTitle]="data.schoolName"
          [nzDescription]="'联系电话:' + data.schoolPhone"
        ></nz-card-meta>
      </nz-card>
      <ng-template #coverTemplate>
        <img style="height: 150px" alt="example" [src]="'data:image/jpeg;base64,'+formatString(data.picBase64)" />
      </ng-template>
      <ng-template #actionSetting>
        <button nz-button nzType="danger" (click)="detail(data)">查看详情</button>
      </ng-template>

<!--      <div class="item-card">-->
<!--        <div class="item-header">-->
<!--          <img [src]="'data:image/jpeg;base64,'+formatString(data.picBase64)" alt="暂未上传" height="60px;" width="60px" />-->
<!--          <span>{{data.schoolName}}</span>-->
<!--        </div>-->

<!--        <p class="school-intro">-->
<!--          联系电话：{{data.schoolPhone}}-->
<!--        </p>-->
<!--        <button nz-button nzType="danger" (click)="detail(data)">查看详情</button>-->

<!--      </div>-->

    </div>

  </div>


  <button nz-button nzType="danger" (click)="openModel()">求学问答</button>

<!--    <div class="footer-content content">-->
<!--      <div *ngFor="let item of listOfQuestion;let i=index">-->
<!--        <p>问题{{i+1}}：{{item.question}}</p>-->
<!--        <p>解答{{i+1}}：{{item.answer}}</p>-->
<!--      </div>-->
<!--    </div>-->
<!--  </div>-->
</div>

<nz-modal [(nzVisible)]="openVisiable" nzTitle="求学问答" [nzFooter]="null" (nzOnCancel)="openVisiable=!openVisiable"
          [nzWidth]="1500">
  <div class="footer">
    <div class="footer-content" style="font-size: 25px">
      <div *ngFor="let item of listOfQuestion;let i=index">
        <p style="color: #dc2424">问题{{i+1}}：{{item.question}}</p>
        <div>
          <div class="ql-editor" [innerHTML]="item?.answer"></div>
        </div>
      </div>
    </div>
  </div>
</nz-modal>

<nz-modal [(nzVisible)]="isVisible" nzTitle="学校详情" [nzFooter]="null" (nzOnCancel)="isVisible=!isVisible"
  [nzWidth]="1500">
  <div class="item-card">
    <h2 style="font-size: 3em">
      {{detailInfo?.schoolName}}
    </h2>
    <div>
      <div class="ql-editor" [innerHTML]="detailInfo?.schoolDescribe"></div>
    </div>

  </div>
</nz-modal>

<nz-modal [(nzVisible)]="report.isVisible" nzTitle="报名" (nzOnCancel)="report.isVisible=!report.isVisible"
  (nzOnOk)="saveReport()">
  <form nz-form [formGroup]="accountEditForm">
    <nz-form-item>
      <nz-form-label nzXs="24" nzSm="7" nzFor="realName" nzRequired>姓名
      </nz-form-label>
      <nz-form-control nzXs="24" nzSm="14" [nzErrorTip]="'请输入姓名!'">
        <input nz-input formControlName="realName" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzXs="24" nzSm="7" nzFor="phone" nzRequired>电话
      </nz-form-label>
      <nz-form-control nzXs="24" nzSm="14" [nzErrorTip]="'请输入电话!'">
        <input nz-input formControlName="phone" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzXs="24" nzSm="7" nzFor="address" nzRequired>家庭住址
      </nz-form-label>
      <nz-form-control nzXs="24" nzSm="14" [nzErrorTip]="'请输入家庭住址!'">
        <input nz-input formControlName="address" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzXs="24" nzSm="7" nzFor="schoolId">意向学校
      </nz-form-label>
      <nz-form-control nzXs="24" nzSm="14" [nzErrorTip]="'请选择意向学校!'">
        <nz-select formControlName="schoolId" nzAllowClear nzPlaceHolder="请选择意向学校">
          <nz-option *ngFor="let school of listOfDataSchool" [nzValue]="school.id"
            [nzLabel]="school.schoolName"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzXs="24" nzSm="7" nzFor="recommendUserId">推荐人
      </nz-form-label>
      <nz-form-control nzXs="24" nzSm="14" [nzErrorTip]="'请选择推荐人!'">
        <nz-select formControlName="recommendUserId" nzAllowClear nzPlaceHolder="请选择推荐人">
          <nz-option *ngFor="let user of listOfUser" [nzValue]="user.id" [nzLabel]="user.realName"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>
  </form>
</nz-modal>
