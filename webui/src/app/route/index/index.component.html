  </div>
  <div class="carousel">
    <nz-carousel nzAutoPlay>
      <div nz-carousel-content *ngFor="let data of listOfData">

        <img [src]="'data:image/jpeg;base64,'+formatString(data.picBase64)" alt="暂未上传" height="550px" width="100%"/>
      </div>
    </nz-carousel>

  </div>

  <div class="intro content">
    <h2>
      院校介绍
    </h2>
   <h4>
    为家长、学生提供详细的学校介绍服务
   </h4>
  </div>

  <div class="school content">
    <div class="item" *ngFor="let data of listOfData">

      <div class="item-card">
        <div class="item-header">
        <img [src]="'data:image/jpeg;base64,'+formatString(data.picBase64)" alt="暂未上传" height="50px;" width="50px"/>
        <span>{{data.schoolName}}</span>
      </div>

        <p [innerHTML]="data.schoolName" class="school-intro">

        </p>
        <button nz-button nzType="danger" (click)="detail(data)">查看详情</button>

      </div>
    </div>
  </div>

<!--  <div class="img content">-->
<!--   <div *ngFor="let data of listOfData">-->

<!--     <img [src]="'data:image/jpeg;base64,'+formatString(data.picBase64)" alt="暂未上传"  width="50%"/>-->
<!--   </div>-->
<!--  </div>-->

  <div class="footer">
    <div class="footer-content content">
      <h4>留言框</h4>
      <textarea rows="8" nz-input [(ngModel)]="inputValue"></textarea>

    </div>
  </div>
</div>


<nz-modal [(nzVisible)]="isVisible" nzTitle="学校详情" [nzFooter]="null" (nzOnCancel)="isVisible=!isVisible" [nzWidth]="800">
  <div class="item-card">
    <h2 style="font-size: 3em">
      {{detailInfo.schoolName}}
    </h2>
    <p [innerHTML]="detailInfo.schoolDescribe" class="school-intro">

    </p>

  </div>
</nz-modal>
