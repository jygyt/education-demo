<div class="container">
  <!-- <button nzShape="circle" class="fixed-button" nz-button nzType="primary" nzSize="large"
    (click)="openReport()">点击报名</button> -->

    <div Button class="fixed-button"  (onClick)="openReport()">点击报名</div>
  <div class="header">
  </div>
  <div class="carousel">

    <app-carousel [images]="listOfData"></app-carousel>

  </div>

  <div class="intro content">
    <h2>
      院校介绍
    </h2>
    <h4>
      为家长、学生提供详细的学校介绍服务
    </h4>
  </div>

  <div class="school content">
    <div class="item" *ngFor="let data of listOfDataSchool">

      <div class="item-card">
        <div class="item-header">
          <div class="left">
            <img [src]="'data:image/jpeg;base64,'+formatString(data.picBase64)" alt="暂未上传" height="40px;"
              width="40px" />

            <span>{{data.schoolName}}{{data.schoolName}}{{data.schoolName}}</span>
          </div>

        </div>
        <p style="color: gray;font-size: 15px;">

          联系电话：
          <a [href]="'tel:' +data.schoolPhone ">{{data.schoolPhone}}</a>

        </p>
        <a class="btn" (click)="detail(data)">查看详情</a>
      </div>
    </div>

  </div>

  <div class="footer">
    <div class="footer-content content">
      <div *ngFor="let item of listOfQuestion;let i=index" style="margin-bottom: 15px;">
        <p>问题{{i+1}}：{{item.question}}</p>
        <p>解答{{i+1}}：{{item.answer}}</p>
      </div>
    </div>
  </div>
</div>
