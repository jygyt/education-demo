<div class="container">

    <div Button class="fixed-button"  (onClick)="openReport()">点击报名</div>
  <div Button class="fixed-button1">

      联系电话
    </a>
  </div>
  <img class="fixed-img" src="assets/imgs/qrcode.jpg">
  <div class="header">
    <div class="header-info  content">
      <div class="logo">
        <img src="assets/imgs/logo.png" />
      </div>
  </div>
<!--  <div class="carousel">-->

<!--    <app-carousel [images]="listOfData"></app-carousel>-->

<!--  </div>-->
  <div class="img-card">
    <ng-container *ngIf="listOfData.length">
      <WingBlank>
        <Carousel id="carousel" [infinite]="true" [vertical]="false" [selectedIndex]="carouselIndex" (afterChange)="afterCarousel($event)">
          <div *ngFor="let item of listOfData; let i=index;">
            <CarouselSlide>
              <div style="display: inline-block; width: 100%;height:100%;border-radius: 20px;">
                <ng-container>
                  <img [src]="item.picBase64" alt="">
                </ng-container>
              </div>
              <p class="title">{{item.carouselTitle}}</p>
            </CarouselSlide>
          </div>

        </Carousel>
      </WingBlank>

    </ng-container>

  </div>

  <div class="intro content">
    <h2>
      院校介绍
    </h2>
    <h4>
      为家长、学生提供详细的学校介绍服务
    </h4>
  </div>

  <div class="school content">
    <div class="item" *ngFor="let data of listOfDataSchool" (click)="detail(data)">
      <div class="left1">
        <img [src]="data.picBase64" alt="暂未上传" height="100px;"
             width="120px" />
      </div>
      <div class="right1">
        <p style="overflow: hidden;
            word-wrap: break-word;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-height: 25px;">
          <span>{{data.schoolName}}</span>
        </p>
<!--        <p style="margin-top: 5px" *ngIf="data.schoolPhone">-->
<!--          联系电话:-->
<!--          <a [href]="'tel:' +data.schoolPhone ">{{data.schoolPhone}}</a>-->
<!--        </p>-->
        <p style="margin-top: 5px">
          <a style="color: #1890FF" class="btn" (click)="detail(data)">查看详情</a>
        </p>
      </div>

<!--      <div class="item-card" style="border-top:1px solid #F00 " (click)="detail(data)">-->

<!--              width="120px" />-->

<!--            <span>{{data.schoolName}}</span>-->
<!--          </div>-->

<!--        </div>-->

<!--        </p>-->
<!--        <a class="btn" (click)="detail(data)">查看详情</a>-->
<!--      </div>-->
    </div>

  </div>

  <div class="intro content">
    <h2>
      求学问答
    </h2>
  </div>
  <div class="footer">
    <div class="footer-content content">
      <div *ngFor="let item of listOfQuestion;let i=index" style="margin-bottom: 15px;">
        <p><a style="color: #1890FF" class="btn" (click)="detailQuestion(item)">{{item.question}}</a></p>
<!--        <div class="ql-editor" [innerHTML]="item.answer"></div>-->
      </div>
    </div>
  </div>
</div>
