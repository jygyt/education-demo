<div>
    <Navbar [icon]="icon" [leftContent]="'返回'" [rightContent]="rightContent" (onLeftClick)="onLeftClick()">
        报名
    </Navbar>
    
    <ng-template #icon>
        <Icon [type]="'left'"></Icon>
    </ng-template>
    <div class="padding:0 10px">
        <InputItem [clear]="true" [placeholder]="''" [content]="'姓名'"></InputItem>
        <InputItem [clear]="true" [placeholder]="''" [content]="'电话'" [type]="'money'"></InputItem>
        <InputItem [clear]="true" [placeholder]="''" [content]="'家庭住址'"></InputItem>
        <ListItem Picker [extra]="name3" [arrow]="'horizontal'" [data]="singleArea" [(ngModel)]="value3"
            (ngModelChange)="onOk3($event)">
            意向学校
        </ListItem>
        <ListItem Picker [extra]="name3" [arrow]="'horizontal'" [data]="singleArea" [(ngModel)]="value3"
            (ngModelChange)="onOk3($event)">
            推荐人
        </ListItem>


        <div Button [type]="'primary'" class="save">primary</div>
    </div>
</div>
